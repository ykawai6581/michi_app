name: Rebuild Shinjuku OSM data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-shinjuku-osm-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download current Shinjuku OSM data
        run: npm run data:osm:shinjuku

      - name: Validate generated data
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const geojson = JSON.parse(await readFile('public/data/modern/shinjuku-osm.geojson', 'utf8'))
          const search = JSON.parse(await readFile('public/search/modern-shinjuku.json', 'utf8'))
          if (geojson.type !== 'FeatureCollection' || !Array.isArray(geojson.features) || geojson.features.length === 0) throw new Error('Generated GeoJSON has no features')
          const roads = geojson.features.filter(({ properties }) => properties.type === 'road')
          const exactSeeds = roads.filter(({ properties }) => ['甲州街道', '新宿通り'].includes(properties.name))
          if (roads.length <= exactSeeds.length) throw new Error('Road extract contains only named seeds; surrounding topology is missing')
          if (!Array.isArray(search) || !search.every(({ type }) => type !== 'road')) throw new Error('Search index must contain only non-road entities; roads are generated dynamically')
          console.log(`Validated ${roads.length} road features (${exactSeeds.length} named seeds) and ${search.length} non-road search entities.`)
          NODE

      - name: Upload a review copy
        uses: actions/upload-artifact@v4
        with:
          name: shinjuku-osm-data-${{ github.run_number }}
          path: |
            public/data/modern/shinjuku-osm.geojson
            public/search/modern-shinjuku.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated files when changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/modern/shinjuku-osm.geojson public/search/modern-shinjuku.json
          if git diff --cached --quiet; then
            echo "The generated data is unchanged."
            exit 0
          fi
          git commit -m "Update Shinjuku OSM data"
          git push origin "HEAD:${DEFAULT_BRANCH}"
